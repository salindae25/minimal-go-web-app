name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: |
            go.mod
            Makefile
      - run: make tools
      - run: make check
      - run: go test -race ./...
      - run: docker compose config --quiet
      - run: docker build --tag template-check .
